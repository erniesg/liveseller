<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LiveSeller Controls</title>
  </head>
  <body>
    <main>
      <h1>LiveSeller</h1>
      <p id="connection">Waiting for runtime</p>
      <section id="liveseller-review-log" aria-label="Runtime action review" aria-live="polite">
        <h2>Runtime actions</h2>
        <p>No viewer message captured.</p>
      </section>
      <section aria-label="Seller approvals">
        <button id="approve" type="button">Approve</button>
        <button id="reject" type="button">Reject</button>
      </section>
    </main>
  </body>
</html>
